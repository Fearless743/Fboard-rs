[package]
name = "fboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Fboard Rust core — API-compatible panel with Rust built-ins and Lua plugins"
license = "MIT"

[[bin]]
name = "fboard"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "mysql",
  "chrono",
  "json",
  "bigdecimal",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
bcrypt = "0.15"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
md5 = "0.7"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
dashmap = "6"
async-trait = "0.1"
futures-util = "0.3"
percent-encoding = "2"
serde_urlencoded = "0.7"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde_yaml = "0.9"
