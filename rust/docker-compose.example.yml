services:
  fboard:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    image: fboard-rs:local
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: fboard
      DB_USERNAME: fboard
      DB_PASSWORD: change-me
      APP_URL: http://127.0.0.1:7001
      APP_KEY: change-me-to-the-existing-panel-app-key
      REDIS_URL: redis://redis:6379/0
      FBOARD_PLUGIN_DIRS: /app/plugins
      FBOARD_LOG: info
    ports:
      - "7001:7001"
    volumes:
      - plugins:/app/plugins
      - uploads:/app/storage
    # First run: docker compose -f rust/docker-compose.example.yml run --rm fboard migrate

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root-change-me
      MARIADB_DATABASE: fboard
      MARIADB_USER: fboard
      MARIADB_PASSWORD: change-me
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  plugins:
  uploads:
  mariadb:
  redis:
